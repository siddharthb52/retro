<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Retro Jukebox</title>
  <link rel="stylesheet" href="styles/main.css" />
</head>
<body>
  <header class="appbar">
    <h1>Retro Jukebox</h1>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <div id="tracklist" aria-label="Track list"></div>
      <div class="scene-selector">
        <h3>Scenes</h3>
        <div class="scene-buttons">
          <button class="scene-btn active" data-scene="citypop">City Pop</button>
          <button class="scene-btn" data-scene="oldies">Oldies </button>
        </div>
      </div>
    </aside>

    <section class="player" aria-label="Player">
      <div class="vinyl" id="vinyl" aria-hidden="true">
        <img id="label" alt="record label" />
        <div class="center-hole"></div>
      </div>

      <div class="meta">
        <h2 id="title">-</h2>
        <p id="artist">-</p>
      </div>

      <div class="controls">
        <button id="prev" aria-label="Previous">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
          </svg>
        </button>
        <button id="play" aria-label="Play/Pause">
          <svg id="play-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M8 5v14l11-7z"/>
          </svg>
          <svg id="pause-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="display: none;">
            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
          </svg>
        </button>
        <button id="next" aria-label="Next">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
          </svg>
        </button>
      </div>
      
      <div class="seek-container">
        <span id="current-time">0:00</span>
        <input id="seek" type="range" min="0" max="100" value="0" aria-label="Seek">
        <span id="total-time">0:00</span>
      </div>

      <audio id="audio" preload="metadata"></audio>
    </section>
  </main>

  <script src="app.js" type="module"></script>
</body>
</html>
